/* ═══ UTILS ═══ */
const uid = () => Math.random().toString(36).slice(2,9);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const hexRgb = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgbHex = (r,g,b) => `#${[r,g,b].map(v=>clamp(v,0,255).toString(16).padStart(2,"0")).join("")}`;

function hsvToRgb(h,s,v){h=((h%360)+360)%360;s=clamp(s,0,1);v=clamp(v,0,1);const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r,g,b;if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}return[Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=60*((g-b)/d%6);else if(mx===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}if(h<0)h+=360;return[h,mx?d/mx:0,mx];}

/* ═══ INDEXEDDB PERSISTENCE ═══ */
const DB_NAME="kinetik_db";const DB_VER=1;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains("projects"))db.createObjectStore("projects",{keyPath:"id"});if(!db.objectStoreNames.contains("frames"))db.createObjectStore("frames")};r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e)})}
async function dbSaveProjects(projects){try{const db=await openDB();const tx=db.transaction("projects","readwrite");const st=tx.objectStore("projects");st.clear();projects.forEach(p=>st.put({id:p.id,name:p.name,w:p.w,h:p.h,created:p.created}));await new Promise(r=>{tx.oncomplete=r})}catch(e){console.error("save projects err",e)}}
async function dbLoadProjects(){try{const db=await openDB();const tx=db.transaction("projects","readonly");const st=tx.objectStore("projects");return new Promise(r=>{const req=st.getAll();req.onsuccess=()=>r(req.result||[]);req.onerror=()=>r([])})}catch(e){return[]}}
async function dbSaveFrames(projId,frames){try{const db=await openDB();const tx=db.transaction("frames","readwrite");const st=tx.objectStore("frames");
  const serialized=frames.map(f=>({id:f.id,layers:f.layers.map(l=>{const c=document.createElement("canvas");c.width=l.c.width;c.height=l.c.height;c.getContext("2d").drawImage(l.c,0,0);return{id:l.id,name:l.name,vis:l.vis,op:l.op,blend:l.blend,data:c.toDataURL("image/png")}})}));
  st.put(serialized,projId);await new Promise(r=>{tx.oncomplete=r})}catch(e){console.error("save frames err",e)}}
async function dbLoadFrames(projId){try{const db=await openDB();const tx=db.transaction("frames","readonly");const st=tx.objectStore("frames");return new Promise(r=>{const req=st.get(projId);req.onsuccess=()=>r(req.result||null);req.onerror=()=>r(null)})}catch(e){return null}}
async function deserializeFrames(data,w,h){if(!data)return null;
  const frames=[];
  for(const f of data){
    const layers=[];
    for(const l of f.layers){
      const c=document.createElement("canvas");c.width=w||1920;c.height=h||1080;
      if(l.data){
        await new Promise(res=>{const img=new Image();img.onload=()=>{c.width=img.width;c.height=img.height;c.getContext("2d").drawImage(img,0,0);res()};img.onerror=()=>res();img.src=l.data});
      }
      layers.push({id:l.id,name:l.name,vis:l.vis,op:l.op,blend:l.blend||"Normal",c});
    }
    frames.push({id:f.id,layers});
  }
  return frames;
}
async function dbDeleteFrames(projId){try{const db=await openDB();const tx=db.transaction("frames","readwrite");tx.objectStore("frames").delete(projId)}catch(e){}}

/* ═══ APP ═══ */
function App(){
  const [screen,setScreen]=useState("home");
  const [projects,setProjects]=useState([]);
  const [activeP,setActiveP]=useState(null);
  const [loaded,setLoaded]=useState(false);
  const saved=useRef(new Map());

  // Load from DB on startup
  useEffect(()=>{
    (async()=>{
      const projs=await dbLoadProjects();
      setProjects(projs);
      // Load all frame data
      for(const p of projs){
        const fd=await dbLoadFrames(p.id);
        if(fd){const frames=await deserializeFrames(fd,p.w,p.h);if(frames)saved.current.set(p.id,frames)}
      }
      setLoaded(true);
    })();
  },[]);

  const openP=p=>{setActiveP(p);setScreen("editor")};
  const back=async(id,fd)=>{
    if(id&&fd){saved.current.set(id,fd);await dbSaveFrames(id,fd)}
    setScreen("gallery");
  };
  const getSaved=id=>saved.current.get(id);
  const addProject=async(w,h,name)=>{
    const p={id:uid(),name:name||"Untitled",w,h,created:Date.now()};
    const np=[p,...projects];setProjects(np);await dbSaveProjects(np);openP(p);
  };
  const deleteProject=async(id)=>{
    const np=projects.filter(x=>x.id!==id);setProjects(np);
    saved.current.delete(id);await dbSaveProjects(np);await dbDeleteFrames(id);
  };

  // Auto-save periodically when in editor
  useEffect(()=>{
    if(screen!=="editor"||!activeP)return;
    const interval=setInterval(()=>{
      const fd=saved.current.get(activeP.id);
      if(fd)dbSaveFrames(activeP.id,fd);
    },60000); // save every 60 seconds
    return()=>clearInterval(interval);
  },[screen,activeP]);

  if(!loaded)return(<div style={{position:"fixed",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"#0a0c14",color:"#5bc4f0",fontFamily:"'DM Sans',sans-serif"}}><div style={{textAlign:"center"}}><div style={{fontSize:24,fontWeight:700}}>Kinetik</div><div style={{fontSize:13,color:"#556",marginTop:6}}>Loading your projects...</div></div></div>);

  if(screen==="home")return <Home onGo={()=>setScreen("gallery")}/>;
  if(screen==="gallery")return <Gallery projects={projects} getSaved={getSaved} onBack={()=>setScreen("home")} onNew={addProject} onOpen={openP} onDelete={deleteProject}/>;
  if(screen==="editor")return <Editor project={activeP} saved={saved.current.get(activeP&&activeP.id)} onBack={fd=>back(activeP&&activeP.id,fd)} onSave={fd=>{if(activeP)saved.current.set(activeP.id,fd)}}/>;
  return null;
}

/* ═══ HOME ═══ */
function Home({onGo}){
  const [ready,setReady]=useState(false);
  useEffect(()=>{requestAnimationFrame(()=>setReady(true))},[]);
  // Animated dots
  const dots=useRef(Array.from({length:40},()=>({
    x:Math.random()*100,y:Math.random()*100,
    r:Math.random()*2+1,
    dx:(Math.random()-.5)*.15,dy:(Math.random()-.5)*.15,
    op:Math.random()*.3+.1,
    hue:Math.floor(Math.random()*3) // 0=blue, 1=purple, 2=coral
  }))).current;
  const dotCanvas=useRef(null);
  useEffect(()=>{
    const c=dotCanvas.current;if(!c)return;
    c.width=c.offsetWidth*2;c.height=c.offsetHeight*2;
    const ctx=c.getContext("2d");
    let raf;
    const colors=["91,196,240","123,108,246","232,93,74"];
    const draw=()=>{
      ctx.clearRect(0,0,c.width,c.height);
      dots.forEach(d=>{
        d.x+=d.dx;d.y+=d.dy;
        if(d.x<0||d.x>100)d.dx*=-1;
        if(d.y<0||d.y>100)d.dy*=-1;
        const px=d.x/100*c.width,py=d.y/100*c.height;
        ctx.beginPath();ctx.arc(px,py,d.r*2,0,6.28);
        ctx.fillStyle=`rgba(${colors[d.hue]},${d.op})`;ctx.fill();
        // Connection lines to nearby dots
        dots.forEach(d2=>{
          if(d===d2)return;
          const dx2=(d2.x-d.x)/100*c.width,dy2=(d2.y-d.y)/100*c.height;
          const dist=Math.sqrt(dx2*dx2+dy2*dy2);
          if(dist<80){
            ctx.beginPath();ctx.moveTo(px,py);
            ctx.lineTo(d2.x/100*c.width,d2.y/100*c.height);
            ctx.strokeStyle=`rgba(${colors[d.hue]},${.04*(1-dist/80)})`;
            ctx.lineWidth=1;ctx.stroke();
          }
        });
      });
      raf=requestAnimationFrame(draw);
    };
    draw();
    return()=>cancelAnimationFrame(raf);
  },[]);

  return(
    <div style={{position:"fixed",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",overflow:"hidden",fontFamily:"'DM Sans',sans-serif",background:"#0a0c14"}}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
      <style>{`
        @keyframes homeIn{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
        @keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
      `}</style>

      {/* Particle canvas */}
      <canvas ref={dotCanvas} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}/>

      {/* Gradient overlay at bottom */}
      <div style={{position:"absolute",bottom:0,left:0,right:0,height:"40%",background:"linear-gradient(to top,rgba(10,12,20,.9),transparent)",pointerEvents:"none"}}/>

      {/* Content */}
      <div style={{position:"relative",zIndex:1,textAlign:"center",animation:ready?"homeIn .7s cubic-bezier(.16,1,.3,1) both":"none"}}>
        {/* Logo mark */}
        <div style={{width:80,height:80,margin:"0 auto 20px",borderRadius:22,background:"linear-gradient(135deg,rgba(91,196,240,.15),rgba(123,108,246,.15),rgba(232,93,74,.15))",backdropFilter:"blur(10px)",display:"flex",alignItems:"center",justifyContent:"center",border:"1px solid rgba(255,255,255,.08)"}}>
          <svg width="44" height="44" viewBox="0 0 44 44">
            <defs><linearGradient id="klogo" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#5bc4f0"/><stop offset="50%" stopColor="#7b6cf6"/><stop offset="100%" stopColor="#e85d4a"/></linearGradient></defs>
            <path d="M10 34l2.5-7.5L26 13a3 3 0 014.2 4.2L17 30.5z" fill="none" stroke="url(#klogo)" strokeWidth="2.2" strokeLinejoin="round"/>
            {/* Film strip */}
            <rect x="32" y="8" width="4" height="4" rx=".8" fill="#5bc4f0" opacity=".5"/>
            <rect x="32" y="14" width="4" height="4" rx=".8" fill="#7b6cf6" opacity=".5"/>
            <rect x="32" y="20" width="4" height="4" rx=".8" fill="#e85d4a" opacity=".5"/>
          </svg>
        </div>

        <h1 style={{margin:0,fontSize:42,fontWeight:800,letterSpacing:-1.5,color:"#fff",lineHeight:1}}>
          Kinetik
        </h1>
        <div style={{margin:"8px auto 0",width:120,height:3,borderRadius:2,background:"linear-gradient(90deg,#5bc4f0,#7b6cf6,#e85d4a)",animation:"shimmer 3s ease-in-out infinite",backgroundSize:"200% 100%"}}/>
        <p style={{margin:"12px 0 0",fontSize:13,color:"rgba(255,255,255,.35)",fontWeight:500,letterSpacing:1}}>ANIMATE YOUR IDEAS</p>
      </div>

      {/* CTA */}
      <div style={{position:"relative",zIndex:1,marginTop:44,animation:ready?"homeIn .7s cubic-bezier(.16,1,.3,1) .15s both":"none"}}>
        <button onClick={onGo} style={{
          display:"flex",alignItems:"center",justifyContent:"center",gap:10,padding:"17px 52px",
          borderRadius:16,border:"1px solid rgba(255,255,255,.1)",
          background:"rgba(255,255,255,.06)",backdropFilter:"blur(12px)",
          color:"#fff",fontSize:16,fontWeight:600,cursor:"pointer",fontFamily:"inherit",
          touchAction:"manipulation",transition:"all .2s",
        }}
          onTouchStart={e=>{e.currentTarget.style.transform="scale(0.96)";e.currentTarget.style.background="rgba(255,255,255,.1)"}}
          onTouchEnd={e=>{e.currentTarget.style.transform="scale(1)";e.currentTarget.style.background="rgba(255,255,255,.06)"}}>
          <Icon name="folder" size={18} color="#5bc4f0"/> Open Gallery
        </button>
      </div>

      <div style={{position:"absolute",bottom:24,fontSize:10,color:"rgba(255,255,255,.15)",fontWeight:500,letterSpacing:1,zIndex:1}}>KINETIK v1.0</div>
    </div>
  );
}

/* ═══ GALLERY ═══ */
function Gallery({projects,getSaved,onBack,onNew,onOpen,onDelete}){
  const [showNew,setShowNew]=useState(false);
  const [w,setW]=useState(1920);const [h,setH]=useState(1080);
  const [preview,setPreview]=useState(null); // project being previewed
  const [previewAnim,setPreviewAnim]=useState(false);
  const [previewY,setPreviewY]=useState(0); // for swipe dismiss
  const [previewFrame,setPreviewFrame]=useState(0);
  const dragStart=useRef(null);
  const [projName,setProjName]=useState("Untitled");

  // Cached thumbnails at reasonable res — no more lag
  const thumbCache=useRef(new Map());
  const mkThumb=(p,fi,maxW)=>{
    const fd=getSaved(p.id);
    if(!fd||fi>=fd.length)return null;
    const key=p.id+"_"+fi+"_"+maxW;
    if(thumbCache.current.has(key))return thumbCache.current.get(key);
    const f=fd[fi];
    const tw=maxW,th=Math.round(maxW*p.h/p.w);
    const c=document.createElement("canvas");c.width=tw;c.height=th;
    const ctx=c.getContext("2d");ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.fillStyle="#fff";ctx.fillRect(0,0,tw,th);ctx.fillStyle="#fff";ctx.fillRect(0,0,tw,th);
    for(const l of f.layers){if(l.vis){ctx.globalAlpha=l.op;ctx.drawImage(l.c,0,0,tw,th)}}
    const url=c.toDataURL("image/jpeg",0.88);
    thumbCache.current.set(key,url);return url;
  };
  const getThumb=(p)=>mkThumb(p,0,360);
  const getFrameThumb=(p,fi)=>mkThumb(p,fi,540);
  const getFrameCount=(p)=>{const fd=getSaved(p.id);return fd?fd.length:0};
  // Clear cache on gallery re-entry
  useEffect(()=>{thumbCache.current.clear()},[projects]);

  const openPreview=(p)=>{
    setPreview(p);setPreviewFrame(0);setPreviewY(0);
    requestAnimationFrame(()=>setPreviewAnim(true));
  };
  const closePreview=()=>{
    setPreviewAnim(false);
    setTimeout(()=>{setPreview(null);setPreviewY(0)},250);
  };

  // Swipe to dismiss
  const onPreviewTouchStart=(e)=>{dragStart.current={y:e.touches[0].clientY,time:Date.now()}};
  const onPreviewTouchMove=(e)=>{
    if(!dragStart.current)return;
    const dy=e.touches[0].clientY-dragStart.current.y;
    if(dy>0)setPreviewY(dy);
  };
  const onPreviewTouchEnd=()=>{
    if(previewY>120||(previewY>40&&Date.now()-(dragStart.current&&dragStart.current.time)<200)){closePreview()}
    else{setPreviewY(0)}
    dragStart.current=null;
  };

  return(
    <div style={{position:"fixed",inset:0,background:"#111318",display:"flex",flexDirection:"column",fontFamily:"'DM Sans',sans-serif",WebkitTapHighlightColor:"transparent"}}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
      <style>{`
        @keyframes slideUp{from{opacity:0;transform:translateY(40%)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes cardIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
      `}</style>

      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 14px",paddingTop:"max(env(safe-area-inset-top,0px),8px)",position:"relative",height:"calc(54px + env(safe-area-inset-top,0px))",flexShrink:0}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:"#888",cursor:"pointer",padding:8,touchAction:"manipulation",display:"flex",alignItems:"center",gap:4,fontSize:13,fontFamily:"inherit",fontWeight:500}}>
          <Icon name="back" size={20} color="#888"/> Back
        </button>
        <span style={{fontSize:15,fontWeight:700,color:"#eee",position:"absolute",left:"50%",transform:"translateX(-50%)"}}>Gallery</span>
        <button onClick={()=>setShowNew(true)} style={{background:"none",border:"none",cursor:"pointer",padding:8,touchAction:"manipulation"}}>
          <Icon name="plus" size={22} color="#5bc4f0"/>
        </button>
      </div>

      <div style={{width:"100%",height:1,background:"linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)"}}/>

      {/* Grid */}
      <div style={{flex:1,overflowY:"auto",padding:"12px 10px",WebkitOverflowScrolling:"touch"}}>
        {projects.length===0?(
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"70vh",gap:16}}>
            <div style={{width:64,height:64,borderRadius:16,background:"rgba(255,255,255,.04)",display:"flex",alignItems:"center",justifyContent:"center"}}>
              <Icon name="image" size={28} color="#444"/>
            </div>
            <p style={{color:"#555",fontSize:14,margin:0,fontWeight:500}}>No projects yet</p>
            <button onClick={()=>setShowNew(true)} style={{padding:"12px 36px",borderRadius:12,border:"none",background:"linear-gradient(135deg,#5bc4f0,#4a9fd4)",color:"#fff",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation"}}>Create First Project</button>
          </div>
        ):(
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
            {projects.map((p,i)=>{
              const thumb=getThumb(p);
              const fc=getFrameCount(p);
              return(
                <button key={p.id} onClick={()=>openPreview(p)} style={{
                  background:"none",border:"none",borderRadius:8,padding:0,cursor:"pointer",overflow:"hidden",textAlign:"left",
                  touchAction:"manipulation",animation:`cardIn .3s ease-out ${i*.05}s both`,willChange:"transform,opacity",
                }}>
                  <div style={{width:"100%",aspectRatio:"1/1",background:"#fff",borderRadius:8,overflow:"hidden",border:"1px solid #2a2c34",position:"relative"}}>
                    {thumb?<img src={thumb} alt="" style={{width:"100%",height:"100%",objectFit:"cover",imageRendering:"auto"}}/>
                      :<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",background:"#1a1c22"}}><Icon name="image" size={20} color="#333"/></div>}
                  </div>
                  <div style={{padding:"4px 2px"}}>
                    <div style={{fontSize:11,fontWeight:500,color:"#bbb",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div>
                    <div style={{fontSize:9,color:"#555"}}>{p.w}×{p.h}{fc>0?` · ${fc}f`:""}</div>
                  </div>
                </button>
              );
            })}
          </div>
        )}
      </div>

      {/* ═══ ARTWORK PREVIEW (Ibis style) ═══ */}
      {preview&&(
        <div onClick={closePreview} style={{
          position:"fixed",inset:0,background:previewAnim?"rgba(0,0,0,.65)":"rgba(0,0,0,0)",
          display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,
          transition:"background .3s ease",willChange:"background",
        }}>
          <div onClick={e=>e.stopPropagation()}
            onTouchStart={onPreviewTouchStart} onTouchMove={onPreviewTouchMove} onTouchEnd={onPreviewTouchEnd}
            style={{
              width:"92%",maxWidth:380,borderRadius:16,overflow:"hidden",
              boxShadow:"0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05)",
              transform:`translateY(${previewY}px) scale(${previewAnim?1:.88})`,
              opacity:previewAnim?Math.max(0,1-previewY/250):0,
              transition:previewY===0?"all .35s cubic-bezier(.2,1,.3,1)":"none",
              willChange:"transform,opacity",
            }}>
            {/* Drag handle on dark header */}
            <div style={{background:"#1a1c24",padding:"10px 14px 8px",display:"flex",flexDirection:"column",alignItems:"center"}}>
              <div style={{width:32,height:4,borderRadius:2,background:"#444",marginBottom:8}}/>
              <div style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                <span style={{fontSize:15,fontWeight:600,color:"#eee"}}>{preview.name}</span>
                <span style={{fontSize:11,color:"#666"}}>{preview.w}×{preview.h}</span>
              </div>
            </div>

            {/* Artwork on white */}
            <div style={{background:"#fff",padding:12}}>
              <div style={{width:"100%",aspectRatio:`${preview.w}/${preview.h}`,maxHeight:"50vh",background:"#fafafa",borderRadius:4,overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center"}}>
                {getFrameThumb(preview,previewFrame)?
                  <img src={getFrameThumb(preview,previewFrame)} alt="" style={{width:"100%",height:"100%",objectFit:"contain"}}/>
                  :<div style={{color:"#ddd",fontSize:13}}>Empty canvas</div>}
              </div>
            </div>

            {/* Frame scrubber */}
            {getFrameCount(preview)>1&&(
              <div style={{background:"#f8f8f8",padding:"8px 12px",overflowX:"auto",display:"flex",gap:5,WebkitOverflowScrolling:"touch",borderTop:"1px solid #eee"}}>
                {Array.from({length:getFrameCount(preview)}).map((_,i)=>(
                  <button key={i} onClick={()=>setPreviewFrame(i)} style={{
                    flexShrink:0,width:48,height:34,borderRadius:5,overflow:"hidden",padding:0,
                    border:i===previewFrame?"2.5px solid #5bc4f0":"1.5px solid #ddd",
                    cursor:"pointer",background:"#fff",touchAction:"manipulation",
                    transition:"border-color .15s",
                  }}>
                    {getFrameThumb(preview,i)?
                      <img src={getFrameThumb(preview,i)} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                      :<div style={{fontSize:10,color:"#ccc",display:"flex",alignItems:"center",justifyContent:"center",height:"100%"}}>{i+1}</div>}
                  </button>
                ))}
                <div style={{flexShrink:0,display:"flex",alignItems:"center",paddingLeft:4}}>
                  <span style={{fontSize:10,color:"#aaa",whiteSpace:"nowrap"}}>{getFrameCount(preview)} frames</span>
                </div>
              </div>
            )}

            {/* Actions */}
            <div style={{display:"flex",background:"#1a1c24"}}>
              <button onClick={()=>{closePreview();setTimeout(()=>onOpen(preview),300)}}
                style={{flex:1,padding:"15px 0",border:"none",borderRight:"1px solid #2a2c34",background:"none",color:"#5bc4f0",fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation"}}>
                Edit
              </button>
              <button
                style={{flex:1,padding:"15px 0",border:"none",borderRight:"1px solid #2a2c34",background:"none",color:"#888",fontSize:14,fontWeight:500,cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation"}}>
                Share
              </button>
              <button onClick={()=>{onDelete(preview.id);closePreview()}}
                style={{flex:1,padding:"15px 0",border:"none",background:"none",color:"#e05a47",fontSize:14,fontWeight:500,cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation"}}>
                Delete
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ═══ NEW CANVAS SHEET ═══ */}
      {showNew&&(
        <div onClick={()=>setShowNew(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:50}}>
          <div onClick={e=>e.stopPropagation()} style={{
            width:"100%",maxWidth:420,background:"#1e2028",borderRadius:"20px 20px 0 0",
            padding:"16px 18px 32px",maxHeight:"78vh",overflowY:"auto",
            animation:"slideUp .35s cubic-bezier(.16,1,.3,1) both",willChange:"transform,opacity",
          }}>
            <div style={{width:36,height:4,borderRadius:2,background:"#444",margin:"0 auto 14px"}}/>
            <h2 style={{margin:"0 0 14px",fontSize:17,fontWeight:700,color:"#eee"}}>New Canvas</h2>

            <div style={{marginBottom:12}}>
              <label style={{fontSize:10,color:"#888",fontWeight:600}}>Project Name</label>
              <input type="text" value={projName} onChange={e=>setProjName(e.target.value)} placeholder="Untitled"
                style={{width:"100%",padding:"10px",borderRadius:8,border:"1px solid #333",background:"#151720",color:"#eee",fontSize:14,fontFamily:"inherit",boxSizing:"border-box",marginTop:4}}/>
            </div>

            <div style={{display:"flex",gap:8,marginBottom:14}}>
              <div style={{flex:1}}><label style={{fontSize:10,color:"#888",fontWeight:600}}>Width</label>
                <input type="number" value={w} onChange={e=>setW(+e.target.value)} style={{width:"100%",padding:"10px",borderRadius:8,border:"1px solid #333",background:"#151720",color:"#eee",fontSize:14,fontFamily:"inherit",boxSizing:"border-box",marginTop:4}}/></div>
              <div style={{flex:1}}><label style={{fontSize:10,color:"#888",fontWeight:600}}>Height</label>
                <input type="number" value={h} onChange={e=>setH(+e.target.value)} style={{width:"100%",padding:"10px",borderRadius:8,border:"1px solid #333",background:"#151720",color:"#eee",fontSize:14,fontFamily:"inherit",boxSizing:"border-box",marginTop:4}}/></div>
            </div>

            <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:20}}>
              {PRESETS.map(p=>(<button key={p.l} onClick={()=>{setW(p.w);setH(p.h)}} style={{
                padding:"8px 14px",borderRadius:8,
                border:w===p.w&&h===p.h?"1.5px solid #5bc4f0":"1px solid #333",
                background:w===p.w&&h===p.h?"rgba(91,196,240,0.1)":"transparent",
                color:w===p.w&&h===p.h?"#5bc4f0":"#aaa",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation",
              }}>{p.l}<br/><span style={{fontSize:9,fontWeight:400,opacity:.6}}>{p.w}×{p.h}</span></button>))}
            </div>

            <button onClick={()=>{onNew(w,h,projName||"Untitled");setShowNew(false);setProjName("Untitled")}} style={{
              width:"100%",padding:"14px 0",borderRadius:12,border:"none",
              background:"linear-gradient(135deg,#5bc4f0,#4a9fd4)",color:"#fff",fontSize:15,fontWeight:700,
              cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation",
            }}>Create</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════
   EDITOR - Ibis Paint style
   ═══════════════════════════════════════ */
function Editor({project,saved,onBack,onSave}){
  const W=project.w,H=project.h;
  const mkLayer=(name="Layer 1")=>{const c=document.createElement("canvas");c.width=W;c.height=H;return{id:uid(),name,c,vis:true,op:1,blend:"Normal"}};
  const mkFrame=()=>({id:uid(),layers:[mkLayer()]});

  // State
  const [frames,setFrames]=useState(()=>saved||[mkFrame()]);

  // Auto-save frames to parent ref on changes and visibility change
  const framesForSave=useRef(null);
  useEffect(()=>{framesForSave.current=frames},[frames]);
  useEffect(()=>{
    const save=()=>{if(framesForSave.current&&onSave)onSave(framesForSave.current)};
    // Save when app goes to background
    const onVis=()=>{if(document.hidden)save()};
    document.addEventListener("visibilitychange",onVis);
    // Save every 15 seconds while editing
    const interval=setInterval(save,30000);
    // Save on beforeunload
    window.addEventListener("beforeunload",save);
    return()=>{document.removeEventListener("visibilitychange",onVis);clearInterval(interval);window.removeEventListener("beforeunload",save);save()};
  },[onSave]);
  const [fi,setFi]=useState(0);
  const [li,setLi]=useState(0);
  const [tool,setTool]=useState("brush");
  const [brush,setBrush]=useState(BRUSHES[0]);
  const [eraser,setEraser]=useState(ERASERS[0]);
  const [sz,setSz]=useState(8);
  const [eraserSz,setEraserSz]=useState(30);
  const [opac,setOpac]=useState(1);
  const [eraserOpac,setEraserOpac]=useState(1);
  const [col,setCol]=useState("#000000");
  const [hsv,setHsv]=useState([0,0,0]);
  const [stab,setStab]=useState(4);
  const prevTool=useRef("brush"); // for quick swap
  const [fps,setFps]=useState(12);
  const [playing,setPlaying]=useState(false);
  const [onion,setOnion]=useState(true);
  const [onionN,setOnionN]=useState(2);
  const [onionA,setOnionA]=useState(0.25);
  const [panel,setPanel]=useState(null);
  const [cursorPos,setCursorPos]=useState(null); // {x,y} screen coords for brush/eraser preview
  const [zoom,setZoom]=useState(0.25); // start small, auto-fit will adjust
  const [pan,setPan]=useState({x:0,y:0});
  const [rot,setRot]=useState(0);
  const [undos,setUndos]=useState([]);
  const [redos,setRedos]=useState([]);
  const [sym,setSym]=useState("off");
  const [ruler,setRuler]=useState("off"); // off, line, circle, ellipse
  const [refImg,setRefImg]=useState(null);

            <canvas ref={displayRef} style={{display:"block",width:W,height:H,maxWidth:"none",background:canvasBg==="white"?"#fff":"repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 0 0/16px 16px",pointerEvents:"auto",touchAction:"none",imageRendering:"auto",WebkitTouchCallout:"none",WebkitUserSelect:"none"}}/>
          </div>
        </div>

        {/* ═══ CURSOR PREVIEW ═══ */}
        {cursorPos&&(tool==="brush"||tool==="eraser"||tool==="smudge")&&!gestActive.current&&(()=>{
          const area=canvasAreaRef.current;
          if(!area)return null;
          const ar=area.getBoundingClientRect();
          const activeSz=tool==="eraser"?eraserSz:sz;
          const br=tool==="eraser"?eraser:brush;
          // Match actual stamp size: pressure-sensitive brushes draw at ~70% of max at typical pressure
          const effectiveSz=br.psz?activeSz*0.7:activeSz;
          const screenSz=effectiveSz*zoom;
          if(screenSz<3)return null;
          const cx=cursorPos.x-ar.left;
          const cy=cursorPos.y-ar.top;
          return <div style={{
            position:"absolute",left:cx-screenSz/2,top:cy-screenSz/2,
            width:screenSz,height:screenSz,borderRadius:"50%",
            border:"1px solid rgba(140,140,140,0.45)",
            pointerEvents:"none",zIndex:20,
            transition:"width 0.08s,height 0.08s",
          }}/>;
        })()}

        {/* ═══ PANELS ═══ */}
        {panel&&(<div onClick={e=>{e.stopPropagation();closeP()}} style={{position:"absolute",inset:0,zIndex:25}}>

          {/* Tool Grid */}
          {panel==="tools"&&(<div onClick={e=>e.stopPropagation()} style={{position:"absolute",left:8,bottom:8,background:TH.panelBg,border:`1px solid ${TH.panelBorder}`,borderRadius:14,padding:10,boxShadow:"0 8px 30px rgba(0,0,0,.5)",display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:3}}>
            {[["brush","Brush"],["eraser","Eraser"],["bucket","Bucket"],["eyedropper","Picker"],["hand","Hand"],["smudge","Smudge"],["lasso","Lasso"],["rectsel","Select"],["text","Text"],["transform","Move"]].map(([id,label])=>(
              <button key={id} onClick={()=>{setTool(id);if(id!=="rectsel"){setRectSelect(null);setRectSelData(null)}if(id!=="lasso"){setHasLasso(false);lassoData.current=null}closeP()}} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"10px 8px",borderRadius:10,border:"none",background:tool===id?TH.accentBg:"transparent",color:tool===id?TH.accent:TH.panelText,cursor:"pointer",fontSize:10,fontWeight:500,fontFamily:"inherit",touchAction:"manipulation",minWidth:44,minHeight:44}}>
                <Icon name={id==="rectsel"?"crop":id==="smudge"?"smudge":id==="lasso"?"lasso":id==="text"?"text":id==="transform"?"move":id==="hand"?"hand":id} size={20} color={tool===id?TH.accent:TH.panelText}/>{label}
              </button>))}
          </div>)}

          {/* Brush Panel (Ibis style - lighter) */}
          {panel==="brush"&&(<div onClick={e=>e.stopPropagation()} style={{position:"absolute",left:0,right:0,bottom:0,maxHeight:"70vh",background:TH.brushPanel,borderRadius:"16px 16px 0 0",display:"flex",flexDirection:"column",boxShadow:"0 -4px 20px rgba(0,0,0,.3)"}}>
            <div style={{width:36,height:4,borderRadius:2,background:"#999",margin:"8px auto 4px"}}/>
            <div style={{padding:"6px 14px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:14,fontWeight:700,color:TH.brushText}}>Brush ({BRUSHES.length})</span>
            </div>
            {/* Preview stroke */}
            <div style={{margin:"8px 14px",height:40,background:"repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 0 0/10px 10px",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>
              <svg width="100%" height="30" viewBox="0 0 240 30"><path d="M15,25 Q60,3 120,15 Q180,27 225,5" fill="none" stroke={col} strokeWidth={Math.min(sz/3,6)} strokeLinecap="round" opacity={opac}/></svg>
            </div>
            {/* Brush list */}
            <div style={{flex:1,overflowY:"auto",padding:"0 10px 6px",maxHeight:"30vh"}}>
              {(tool==="eraser"?ERASERS:[...BRUSHES,...customBrushes]).map(b=>(
                <button key={b.id} onClick={()=>tool==="eraser"?setEraser(b):setBrush(b)} style={{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"8px",marginBottom:2,borderRadius:6,textAlign:"left",
                  border:(tool==="eraser"?eraser.id:brush.id)===b.id?`2px solid ${TH.sliderTrack}`:"2px solid transparent",
                  background:(tool==="eraser"?eraser.id:brush.id)===b.id?"rgba(74,122,181,0.1)":"transparent",
                  color:TH.brushText,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>
                  <svg width="40" height="14" viewBox="0 0 40 14"><path d={`M3,12 Q10,${b.hard>.5?2:7} 20,7 Q30,${b.hard>.5?12:4} 37,2`} fill="none" stroke={TH.brushText} strokeWidth="2" strokeLinecap="round"/></svg>
                  {b.name}
                </button>))}
            </div>
            {/* Sliders */}
            <div style={{padding:"8px 14px 12px",borderTop:"1px solid #bbb"}}>
              {tool!=="eraser"&&<button onClick={()=>setShowCBrush(true)} style={{width:"100%",padding:"8px 0",borderRadius:6,border:`1px dashed ${TH.panelBorder}`,background:"transparent",color:TH.accent,fontSize:11,cursor:"pointer",fontFamily:"inherit",marginBottom:4,touchAction:"manipulation"}}>+ Create Custom Brush</button>}
              <ISL label="Thickness" val={tool==="eraser"?eraserSz:sz} set={tool==="eraser"?setEraserSz:setSz} min={1} max={tool==="eraser"?500:120} unit="px"/>
              <ISL label="Opacity" val={Math.round((tool==="eraser"?eraserOpac:opac)*100)} set={v=>tool==="eraser"?setEraserOpac(v/100):setOpac(v/100)} min={1} max={100} unit="%"/>
              <ISL label="Stabilizer" val={stab} set={setStab} min={0} max={20}/>
            </div>
          </div>)}

          {/* Color Panel with HSV wheel */}
          {panel==="color"&&(<div onClick={e=>e.stopPropagation()} style={{position:"absolute",left:0,right:0,bottom:0,maxHeight:"65vh",background:TH.brushPanel,borderRadius:"16px 16px 0 0",display:"flex",flexDirection:"column",boxShadow:"0 -4px 20px rgba(0,0,0,.3)"}}>
            <div style={{width:36,height:4,borderRadius:2,background:"#999",margin:"8px auto 4px"}}/>
            <div style={{flex:1,overflowY:"auto",padding:"6px 14px 14px"}}>

              <div style={{position:"relative",width:"100%",aspectRatio:"1",borderRadius:8,cursor:"crosshair",marginBottom:10,

                onPointerDown={e=>{const r=e.currentTarget.getBoundingClientRect();const update=ev=>{const x=clamp((ev.clientX-r.left)/r.width,0,1);const y=clamp((ev.clientY-r.top)/r.height,0,1);setColHSV(hsv[0],x,1-y)};update(e);const m=ev=>update(ev);const u=()=>{document.removeEventListener("pointermove",m);document.removeEventListener("pointerup",u)};document.addEventListener("pointermove",m);document.addEventListener("pointerup",u)}}>

              </div>
              {/* Hue bar */}

                onPointerDown={e=>{const r=e.currentTarget.getBoundingClientRect();const update=ev=>{const x=clamp((ev.clientX-r.left)/r.width,0,1);setColHSV(x*360,hsv[1],hsv[2])};update(e);const m=ev=>update(ev);const u=()=>{document.removeEventListener("pointermove",m);document.removeEventListener("pointerup",u)};document.addEventListener("pointermove",m);document.addEventListener("pointerup",u)}}>
                <div style={{position:"absolute",left:`${hsv[0]/360*100}%`,top:-1,width:8,height:24,borderRadius:4,border:"2px solid #fff",boxShadow:"0 0 4px rgba(0,0,0,.5)",transform:"translateX(-4px)",pointerEvents:"none"}}/>

                  style={{flex:1,padding:"6px 8px",borderRadius:6,border:"1px solid #aaa",background:"#fff",color:"#333",fontSize:12,fontFamily:"monospace"}}/>

              {/* Palette */}

              {/* Color History */}
              {colorHistory.length>1&&(<div style={{marginTop:10}}>
                <div style={{fontSize:10,color:TH.brushDim,marginBottom:4}}>Recent Colors</div>
                <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                  {colorHistory.map((c,i)=>(<button key={i} onClick={()=>{setCol(c);const[r,g,b]=hexRgb(c);setHsv(rgbToHsv(r,g,b))}} style={{width:24,height:24,borderRadius:4,border:col===c?"2px solid #333":"1px solid #bbb",background:c,cursor:"pointer"}}/>))}
                </div>
              </div>)}
            </div>
          </div>)}

          {/* Layer Panel */}
          {panel==="layers"&&(<div onClick={e=>e.stopPropagation()} style={{position:"absolute",right:0,top:0,bottom:0,width:260,background:TH.panelBg,borderLeft:`1px solid ${TH.panelBorder}`,display:"flex",flexDirection:"column",boxShadow:"-4px 0 20px rgba(0,0,0,.4)"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 10px",borderBottom:`1px solid ${TH.panelBorder}`}}>
              <span style={{fontSize:13,fontWeight:600,color:TH.panelText}}>Layer</span>
              <button onClick={closeP} style={{background:"none",border:"none",color:TH.panelDim,cursor:"pointer"}}><Icon name="x" size={16} color={TH.panelDim}/></button>
            </div>
            <div style={{display:"flex",gap:3,padding:"6px 8px",borderBottom:`1px solid ${TH.panelBorder}`}}>
              <button onClick={addLayer} style={{flex:1,padding:"5px 0",borderRadius:5,border:`1px solid ${TH.panelBorder}`,background:"transparent",color:TH.panelText,cursor:"pointer",fontSize:10,fontFamily:"inherit"}}>+</button>
              <button onClick={delLayer} style={{flex:1,padding:"5px 0",borderRadius:5,border:`1px solid ${TH.panelBorder}`,background:"transparent",color:TH.panelText,cursor:"pointer",fontSize:10,fontFamily:"inherit"}}>Del</button>
              <button onClick={mergeDown} style={{flex:1,padding:"5px 0",borderRadius:5,border:`1px solid ${TH.panelBorder}`,background:"transparent",color:TH.panelText,cursor:"pointer",fontSize:10,fontFamily:"inherit"}}>Merge</button>
              <button onClick={flattenAll} style={{flex:1,padding:"5px 0",borderRadius:5,border:`1px solid ${TH.panelBorder}`,background:"transparent",color:TH.panelText,cursor:"pointer",fontSize:10,fontFamily:"inherit"}}>Flat</button>
            </div>
            <div style={{padding:"4px 8px",borderBottom:`1px solid ${TH.panelBorder}`}}>
              <button onClick={importAsLayer} style={{width:"100%",padding:"5px 0",borderRadius:5,border:`1px solid ${TH.panelBorder}`,background:"transparent",color:TH.accent,cursor:"pointer",fontSize:10,fontFamily:"inherit"}}>Import Image as Layer</button>
            </div>
            <div style={{flex:1,overflowY:"auto",padding:6}}>
              {[...curLayers].reverse().map((l,ri)=>{const idx=curLayers.length-1-ri;return(
                <div key={l.id} onClick={()=>setLi(idx)} style={{display:"flex",alignItems:"center",gap:6,padding:6,marginBottom:3,borderRadius:6,
                  border:idx===li?`1.5px solid ${TH.accent}`:`1px solid ${TH.panelBorder}`,background:idx===li?"rgba(91,196,240,0.1)":"transparent",cursor:"pointer"}}>
                  <div style={{width:32,height:22,borderRadius:3,overflow:"hidden",background:"repeating-conic-gradient(#555 0% 25%,#777 0% 50%) 0 0/8px 8px",flexShrink:0}}>
                    <canvas ref={el=>{if(el){el.width=32;el.height=22;el.getContext("2d").drawImage(l.c,0,0,32,22)}}} style={{width:32,height:22,display:"block"}}/>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:10,fontWeight:500,color:TH.panelText}}>{l.name}</div>
                    <div style={{fontSize:8,color:TH.panelDim}}>{Math.round(l.op*100)}% {l.blend}</div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:1}}>
                    <button onClick={e=>{e.stopPropagation();moveLayer(idx,1)}} style={{background:"none",border:"none",color:TH.panelDim,cursor:"pointer",padding:0,fontSize:10,lineHeight:1}}>▲</button>
                    <button onClick={e=>{e.stopPropagation();moveLayer(idx,-1)}} style={{background:"none",border:"none",color:TH.panelDim,cursor:"pointer",padding:0,fontSize:10,lineHeight:1}}>▼</button>
                  </div>
                  <button onClick={e=>{e.stopPropagation();toggleVis(idx)}} style={{background:"none",border:"none",cursor:"pointer",padding:2}}>
                    <Icon name={l.vis?"eye":"eyeOff"} size={14} color={l.vis?TH.panelText:TH.panelDim}/></button>
                </div>)})}
            </div>
            {/* Selected layer settings */}
            {curLayers[li]&&(<div style={{padding:"8px 10px",borderTop:`1px solid ${TH.panelBorder}`}}>
              <div style={{fontSize:10,color:TH.panelDim,marginBottom:4}}>Opacity</div>
              <input type="range" min={0} max={100} value={Math.round(curLayers[li].op*100)} onChange={e=>setLayerOp(li,e.target.value/100)} style={{width:"100%",accentColor:TH.accent,height:4}}/>
              <div style={{fontSize:10,color:TH.panelDim,marginTop:6,marginBottom:2}}>Blend</div>
              <select value={curLayers[li].blend} onChange={e=>setLayerBlend(li,e.target.value)} style={{width:"100%",padding:"5px",borderRadius:5,border:`1px solid ${TH.panelBorder}`,background:"#555",color:TH.panelText,fontSize:11}}>
                {BLENDS.map(m=><option key={m} value={m}>{m}</option>)}
              </select>
            </div>)}
          </div>)}

          {/* Anim Panel */}
          {panel==="anim"&&(<div onClick={e=>e.stopPropagation()} style={{position:"absolute",left:0,right:0,bottom:0,maxHeight:"65vh",background:TH.panelBg,borderRadius:"16px 16px 0 0",display:"flex",flexDirection:"column",boxShadow:"0 -4px 20px rgba(0,0,0,.3)"}}>
            <div style={{width:36,height:4,borderRadius:2,background:"#666",margin:"8px auto 4px"}}/>
            <div style={{padding:"6px 14px 14px",display:"flex",flexDirection:"column",gap:8}}>
              <span style={{fontSize:13,fontWeight:600,color:TH.panelText}}>Animation</span>
              <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:TH.panelText}}>
                <span style={{width:50}}>FPS</span>
                <input type="range" min={1} max={60} value={fps} onChange={e=>setFps(+e.target.value)} style={{flex:1,accentColor:TH.accent}}/>
                <span style={{width:20,textAlign:"right",fontSize:10,color:TH.panelDim}}>{fps}</span>
              </div>
              <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:TH.panelText,cursor:"pointer"}}>
                <input type="checkbox" checked={onion} onChange={e=>setOnion(e.target.checked)} style={{accentColor:TH.accent}}/> Onion Skin
              </label>
              {onion&&<React.Fragment>
                <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:TH.panelText}}><span style={{width:50}}>Frames</span><input type="range" min={1} max={6} value={onionN} onChange={e=>setOnionN(+e.target.value)} style={{flex:1,accentColor:TH.accent}}/><span style={{width:16,fontSize:10,color:TH.panelDim}}>{onionN}</span></div>
                <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:TH.panelText}}><span style={{width:50}}>Opacity</span><input type="range" min={5} max={80} value={Math.round(onionA*100)} onChange={e=>setOnionA(e.target.value/100)} style={{flex:1,accentColor:TH.accent}}/><span style={{width:24,fontSize:10,color:TH.panelDim}}>{Math.round(onionA*100)}%</span></div>
              </React.Fragment>}
              <div style={{fontSize:11,fontWeight:600,color:TH.panelText,marginTop:2}}>Symmetry</div>
              <div style={{display:"flex",gap:3}}>{[["off","OFF"],["v","V"],["h","H"],["4","Quad"]].map(([k,l])=>(<button key={k} onClick={()=>setSym(k)} style={{flex:1,padding:"6px 0",borderRadius:5,fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit",border:sym===k?`1.5px solid ${TH.accent}`:`1px solid ${TH.panelBorder}`,background:sym===k?"rgba(91,196,240,0.15)":"transparent",color:sym===k?TH.accent:TH.panelDim}}>{l}</button>))}</div>
              <button onClick={genTween} style={{width:"100%",padding:"10px 0",borderRadius:8,border:"none",background:TH.accent,color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Tween (3 frames)</button>
              <button onClick={exportGif} disabled={exporting} style={{width:"100%",padding:"10px 0",borderRadius:8,border:"none",background:exporting?"#666":"#27ae60",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{exporting?"Exporting...":"Export GIF"}</button>
              <button onClick={exportPng} style={{width:"100%",padding:"10px 0",borderRadius:8,border:`1px solid ${TH.panelBorder}`,background:"transparent",color:TH.panelText,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Export PNG</button>
              <div style={{borderTop:`1px solid ${TH.panelBorder}`,paddingTop:8,marginTop:4}}>
                <div style={{fontSize:11,fontWeight:600,color:TH.panelText,marginBottom:6}}>Canvas Background</div>
                <div style={{display:"flex",gap:3}}>
                  <button onClick={()=>{setCanvasBg("white");sched()}} style={{flex:1,padding:"7px 0",borderRadius:5,fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit",border:canvasBg==="white"?`1.5px solid ${TH.accent}`:`1px solid ${TH.panelBorder}`,background:canvasBg==="white"?"rgba(91,196,240,0.15)":"transparent",color:canvasBg==="white"?TH.accent:TH.panelDim}}>White</button>
                  <button onClick={()=>{setCanvasBg("transparent");sched()}} style={{flex:1,padding:"7px 0",borderRadius:5,fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit",border:canvasBg==="transparent"?`1.5px solid ${TH.accent}`:`1px solid ${TH.panelBorder}`,background:canvasBg==="transparent"?"rgba(91,196,240,0.15)":"transparent",color:canvasBg==="transparent"?TH.accent:TH.panelDim}}>Transparent</button>
                </div>
              </div>
              <div style={{borderTop:`1px solid ${TH.panelBorder}`,paddingTop:8,marginTop:4}}>
                <label style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:TH.panelText,cursor:"pointer"}}>
                  <input type="checkbox" checked={showGrid} onChange={e=>setShowGrid(e.target.checked)} style={{accentColor:TH.accent}}/> Show Grid
                </label>
                {showGrid&&<div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:TH.panelText,marginTop:4}}><span style={{width:50}}>Size</span><input type="range" min={8} max={128} value={gridSize} onChange={e=>setGridSize(+e.target.value)} style={{flex:1,accentColor:TH.accent}}/><span style={{width:24,fontSize:10,color:TH.panelDim}}>{gridSize}</span></div>}
              </div>
            </div>
          </div>)}

          {/* Ruler Panel */}
          {panel==="ruler"&&(<div onClick={e=>e.stopPropagation()} style={{position:"absolute",right:10,top:40,background:TH.panelBg,border:`1px solid ${TH.panelBorder}`,borderRadius:10,padding:8,boxShadow:"0 4px 16px rgba(0,0,0,.4)"}}>
            <div style={{fontSize:11,fontWeight:600,color:TH.panelText,marginBottom:6}}>Ruler</div>
            <div style={{display:"flex",flexDirection:"column",gap:3}}>
              {[["off","OFF"],["line","Line"],["circle","Circle"],["ellipse","Ellipse"]].map(([k,l])=>(<button key={k} onClick={()=>{setRuler(k);if(k==="off")closeP()}} style={{padding:"7px 16px",borderRadius:6,border:ruler===k?`1.5px solid ${TH.accent}`:`1px solid ${TH.panelBorder}`,background:ruler===k?"rgba(91,196,240,0.15)":"transparent",color:ruler===k?TH.accent:TH.panelText,fontSize:11,cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>{l}</button>))}
            </div>
            {refImg&&<div style={{marginTop:8,borderTop:`1px solid ${TH.panelBorder}`,paddingTop:8}}>
              <div style={{fontSize:10,color:TH.panelDim,marginBottom:4}}>Reference Opacity</div>
              <input type="range" min={5} max={100} value={Math.round(refOp*100)} onChange={e=>setRefOp(e.target.value/100)} style={{width:"100%",accentColor:TH.accent}}/>
              <button onClick={()=>{setRefImg(null);sched()}} style={{marginTop:4,padding:"4px 10px",borderRadius:4,border:`1px solid ${TH.panelBorder}`,background:"transparent",color:TH.accentRed,fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>Remove Reference</button>
            </div>}
          </div>)}

          {/* Flip panel */}
          {panel==="flip"&&(<div onClick={e=>e.stopPropagation()} style={{position:"absolute",right:10,top:40,background:TH.panelBg,border:`1px solid ${TH.panelBorder}`,borderRadius:10,padding:8,boxShadow:"0 4px 16px rgba(0,0,0,.4)"}}>
            <button onClick={()=>{const c=curCanvas();if(!c)return;pushUndo();const ctx=c.getContext("2d");const tmp=document.createElement("canvas");tmp.width=W;tmp.height=H;tmp.getContext("2d").drawImage(c,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(tmp,0,0);ctx.restore();sched();closeP()}} style={{display:"block",width:"100%",padding:"8px 16px",borderRadius:6,border:`1px solid ${TH.panelBorder}`,background:"transparent",color:TH.panelText,fontSize:11,cursor:"pointer",fontFamily:"inherit",marginBottom:3,textAlign:"left"}}>Flip Horizontal</button>
            <button onClick={()=>{const c=curCanvas();if(!c)return;pushUndo();const ctx=c.getContext("2d");const tmp=document.createElement("canvas");tmp.width=W;tmp.height=H;tmp.getContext("2d").drawImage(c,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(0,H);ctx.scale(1,-1);ctx.drawImage(tmp,0,0);ctx.restore();sched();closeP()}} style={{display:"block",width:"100%",padding:"8px 16px",borderRadius:6,border:`1px solid ${TH.panelBorder}`,background:"transparent",color:TH.panelText,fontSize:11,cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>Flip Vertical</button>
          </div>)}
        </div>)}
      </div>

      {/* ═══ TEXT INPUT MODAL ═══ */}
      {textMode&&textPos&&(<div onClick={()=>setTextMode(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}}>
        <div onClick={e=>e.stopPropagation()} style={{width:300,background:TH.brushPanel,borderRadius:14,padding:16,boxShadow:"0 8px 30px rgba(0,0,0,.4)"}}>
          <div style={{fontSize:13,fontWeight:600,color:TH.brushText,marginBottom:8}}>Add Text</div>
          <input type="text" value={textInput} onChange={e=>setTextInput(e.target.value)} placeholder="Type here..." autoFocus
            style={{width:"100%",padding:"10px",borderRadius:8,border:"1px solid #aaa",background:"#fff",color:"#333",fontSize:14,fontFamily:"inherit",boxSizing:"border-box",marginBottom:8}}/>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:10}}>
            <span style={{fontSize:11,color:TH.brushDim}}>Size</span>
            <input type="range" min={8} max={120} value={textSize} onChange={e=>setTextSize(+e.target.value)} style={{flex:1,accentColor:TH.sliderTrack}}/>
            <span style={{fontSize:11,color:TH.brushDim}}>{textSize}px</span>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setTextMode(false)} style={{flex:1,padding:"9px 0",borderRadius:8,border:"1px solid #aaa",background:"transparent",color:TH.brushText,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button>
            <button onClick={()=>{
              if(!textInput.trim())return;
              const c=curCanvas();if(!c)return;pushUndo();
              const ctx=c.getContext("2d");ctx.save();ctx.fillStyle=col;ctx.globalAlpha=opac;
              ctx.font=`${textSize}px 'DM Sans', sans-serif`;ctx.textBaseline="top";
              ctx.fillText(textInput,textPos.x,textPos.y);ctx.restore();
              setTextMode(false);setTextInput("");sched();
            }} style={{flex:1,padding:"9px 0",borderRadius:8,border:"none",background:TH.accent,color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Place</button>
          </div>
        </div>
      </div>)}

      {/* ═══ CUSTOM BRUSH MODAL ═══ */}
      {showCBrush&&(<div onClick={()=>setShowCBrush(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}}>
        <div onClick={e=>e.stopPropagation()} style={{width:300,background:TH.brushPanel,borderRadius:14,padding:16,boxShadow:"0 8px 30px rgba(0,0,0,.4)"}}>
          <div style={{fontSize:14,fontWeight:600,color:TH.brushText,marginBottom:10}}>Create Custom Brush</div>
          <input type="text" value={cbForm.name} onChange={e=>setCbForm(p=>({...p,name:e.target.value}))} placeholder="Brush name..."
            style={{width:"100%",padding:"9px",borderRadius:8,border:"1px solid #aaa",background:"#fff",color:"#333",fontSize:13,fontFamily:"inherit",boxSizing:"border-box",marginBottom:8}}/>
          <ISL label="Hardness" val={cbForm.hard} set={v=>setCbForm(p=>({...p,hard:v}))} min={0} max={1} step={0.05}/>
          <ISL label="Spacing" val={cbForm.sp} set={v=>setCbForm(p=>({...p,sp:v}))} min={1} max={20}/>
          <ISL label="Base Opacity" val={cbForm.bop} set={v=>setCbForm(p=>({...p,bop:v}))} min={0.05} max={1} step={0.05}/>
          <ISL label="Min Size" val={cbForm.minSz} set={v=>setCbForm(p=>({...p,minSz:v}))} min={1} max={60}/>
          <ISL label="Max Size" val={cbForm.maxSz} set={v=>setCbForm(p=>({...p,maxSz:v}))} min={1} max={150}/>
          <ISL label="Scatter" val={cbForm.scatter} set={v=>setCbForm(p=>({...p,scatter:v}))} min={0} max={50}/>
          <ISL label="Jitter" val={cbForm.jitter} set={v=>setCbForm(p=>({...p,jitter:v}))} min={0} max={100} unit="%"/>
          <div style={{display:"flex",gap:8,margin:"8px 0"}}>
            <label style={{fontSize:11,color:TH.brushText,display:"flex",alignItems:"center",gap:4,cursor:"pointer"}}>
              <input type="checkbox" checked={cbForm.psz} onChange={e=>setCbForm(p=>({...p,psz:e.target.checked}))} style={{accentColor:TH.sliderTrack}}/> Pressure Size</label>
            <label style={{fontSize:11,color:TH.brushText,display:"flex",alignItems:"center",gap:4,cursor:"pointer"}}>
              <input type="checkbox" checked={cbForm.pop} onChange={e=>setCbForm(p=>({...p,pop:e.target.checked}))} style={{accentColor:TH.sliderTrack}}/> Pressure Opacity</label>
          </div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,color:TH.brushDim,marginBottom:4}}>Tip Shape</div>
            <div style={{display:"flex",gap:3}}>
              {[["r","Round"],["c","Calligraphy"],["f","Flat"],["t","Textured"],["s","Spray"]].map(([k,l])=>(
                <button key={k} onClick={()=>setCbForm(p=>({...p,sh:k}))} style={{flex:1,padding:"6px 0",borderRadius:5,fontSize:9,fontWeight:600,cursor:"pointer",fontFamily:"inherit",border:cbForm.sh===k?"1.5px solid #4a7ab5":"1px solid #aaa",background:cbForm.sh===k?"rgba(74,122,181,0.15)":"transparent",color:cbForm.sh===k?"#4a7ab5":"#666",touchAction:"manipulation"}}>{l}</button>
              ))}
            </div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setShowCBrush(false)} style={{flex:1,padding:"10px 0",borderRadius:8,border:"1px solid #aaa",background:"transparent",color:TH.brushText,fontSize:13,cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation"}}>Cancel</button>
            <button onClick={()=>{
              if(!cbForm.name.trim())return;
              setCustomBrushes(prev=>[...prev,{...cbForm,id:"cb_"+uid(),name:cbForm.name.trim()}]);
              setShowCBrush(false);setCbForm({name:"",hard:.8,sp:2,bop:1,psz:true,pop:false,sh:"r"});
            }} style={{flex:1,padding:"10px 0",borderRadius:8,border:"none",background:TH.sliderTrack,color:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",touchAction:"manipulation"}}>Create</button>
          </div>
        </div>
      </div>)}

      {/* ═══ LASSO DESELECT ═══ */}
      {hasLasso&&(<div style={{position:"absolute",top:44,left:"50%",transform:"translateX(-50%)",zIndex:30,display:"flex",gap:6}}>
        <button onClick={()=>{
          const c=curCanvas();if(c&&lassoData.current){
            const ctx=c.getContext("2d");ctx.drawImage(lassoData.current,lassoOffset.current.x,lassoOffset.current.y)}
          setHasLasso(false);lassoData.current=null;lassoPath.current=[];lassoOffset.current={x:0,y:0};sched();
        }} style={{padding:"6px 14px",borderRadius:8,border:"none",background:TH.accent,color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 2px 8px rgba(0,0,0,.3)"}}>Deselect</button>
        <button onClick={()=>{
          setHasLasso(false);lassoData.current=null;lassoPath.current=[];lassoOffset.current={x:0,y:0};sched();
        }} style={{padding:"6px 14px",borderRadius:8,border:"none",background:"#c0392b",color:"#fff",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 2px 8px rgba(0,0,0,.3)"}}>Delete</button>
      </div>)}

      {/* ═══ RECT SELECT CONTROLS ═══ */}
      {rectSelData&&(<div style={{position:"absolute",top:44,left:"50%",transform:"translateX(-50%)",zIndex:30,display:"flex",gap:5}}>
        <button onClick={()=>{
          // Commit - place selection back
          const c=curCanvas();if(c){const ctx=c.getContext("2d");
            ctx.drawImage(rectSelData,rectSelect.x+rectSelOffset.x,rectSelect.y+rectSelOffset.y)}
          setRectSelect(null);setRectSelData(null);setRectSelOffset({x:0,y:0});sched();
        }} style={{padding:"6px 12px",borderRadius:8,border:"none",background:TH.accent,color:"#fff",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 2px 8px rgba(0,0,0,.3)"}}>Place</button>
        <button onClick={()=>{
          setClipboard(rectSelData);
        }} style={{padding:"6px 12px",borderRadius:8,border:"none",background:"#8e44ad",color:"#fff",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 2px 8px rgba(0,0,0,.3)"}}>Copy</button>
        <button onClick={()=>{
          setRectSelect(null);setRectSelData(null);setRectSelOffset({x:0,y:0});sched();
        }} style={{padding:"6px 12px",borderRadius:8,border:"none",background:"#c0392b",color:"#fff",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 2px 8px rgba(0,0,0,.3)"}}>Delete</button>
        {clipboard&&<button onClick={pasteClipboard} style={{padding:"6px 12px",borderRadius:8,border:"none",background:"#27ae60",color:"#fff",fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 2px 8px rgba(0,0,0,.3)"}}>Paste</button>}
      </div>)}

      {/* ═══ THICKNESS BAR ═══ */}
      <div style={{display:"flex",alignItems:"center",gap:5,padding:"5px 8px",background:"rgba(180,180,180,0.94)",borderTop:"1px solid #aaa",flexShrink:0,zIndex:10}}>
        {/* Quick pen/eraser swap */}
        <button onClick={()=>{
          if(tool==="eraser"){setTool(prevTool.current||"brush")}
          else{prevTool.current=tool;setTool("eraser")}
        }} style={{width:32,height:32,borderRadius:8,border:"none",background:tool==="eraser"?"#e85d4a":"#666",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,touchAction:"manipulation"}}>
          <Icon name={tool==="eraser"?"brush":"eraser"} size={16} color="#fff"/>
        </button>

        <span style={{fontSize:9,color:"#555",width:44,flexShrink:0,lineHeight:1.1}}>{tool==="eraser"?eraser.name:brush.name}</span>
        <span style={{fontSize:10,color:"#333",width:32,textAlign:"right",fontVariantNumeric:"tabular-nums",fontWeight:700}}>{tool==="eraser"?eraserSz:sz}<span style={{fontSize:8,fontWeight:400}}>px</span></span>

        <button onClick={()=>tool==="eraser"?setEraserSz(s=>Math.max(1,s-1)):setSz(s=>Math.max(1,s-1))} style={{width:28,height:28,borderRadius:14,border:"none",background:"#666",color:"#fff",fontSize:15,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",padding:0,flexShrink:0,touchAction:"manipulation"}}>−</button>

        <input type="range" min={1} max={tool==="eraser"?500:120}
          value={tool==="eraser"?eraserSz:sz}
          onChange={e=>tool==="eraser"?setEraserSz(+e.target.value):setSz(+e.target.value)}
          style={{flex:1,height:28,accentColor:TH.sliderTrack,cursor:"pointer",touchAction:"manipulation",WebkitAppearance:"auto",margin:0}}/>

        <button onClick={()=>tool==="eraser"?setEraserSz(s=>Math.min(500,s+1)):setSz(s=>Math.min(120,s+1))} style={{width:28,height:28,borderRadius:14,border:"none",background:"#666",color:"#fff",fontSize:15,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",padding:0,flexShrink:0,touchAction:"manipulation"}}>+</button>
      </div>

      {/* ═══ FRAME STRIP ═══ */}
      <div style={{display:"flex",alignItems:"center",gap:4,padding:"4px 6px",background:"#333",borderTop:"1px solid #555",flexShrink:0,zIndex:10,overflowX:"auto",overflowY:"hidden",WebkitOverflowScrolling:"touch",minHeight:46}}>
        {frames.map((f,i)=>(
          <div key={f.id} onClick={()=>switchFrame(i)} style={{flexShrink:0,width:56,height:34,borderRadius:3,overflow:"hidden",cursor:"pointer",position:"relative",border:i===fi?`2px solid ${TH.accent}`:"2px solid #555",background:"#fff",touchAction:"manipulation"}}>
            <img src={thumb(f,i)} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
            <div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(0,0,0,.5)",fontSize:8,textAlign:"center",padding:"1px 0",color:i===fi?"#fff":"#999",fontWeight:600}}>{i+1}</div>
          </div>))}
        <button onClick={addFrame} style={{flexShrink:0,width:56,height:34,borderRadius:3,border:"2px dashed #666",background:"transparent",color:"#888",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}><Icon name="plus" size={14} color="#888"/></button>
        <div style={{width:1,height:22,background:"#555",margin:"0 2px",flexShrink:0}}/>
        <button onClick={dupFrame} style={{flexShrink:0,background:"none",border:"none",color:"#888",cursor:"pointer",padding:3}}><Icon name="copy" size={15} color="#888"/></button>
        <button onClick={delFrame} style={{flexShrink:0,background:"none",border:"none",color:"#888",cursor:"pointer",padding:3}}><Icon name="trash" size={15} color="#888"/></button>
        <button onClick={()=>setPlaying(p=>!p)} style={{flexShrink:0,background:"none",border:"none",cursor:"pointer",padding:3,marginLeft:"auto"}}>
          <Icon name={playing?"pause":"play"} size={17} color={playing?TH.accent:"#888"}/></button>
      </div>

      {/* ═══ BOTTOM TOOLBAR ═══ */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-around",paddingTop:2,paddingBottom:"max(env(safe-area-inset-bottom,8px),8px)",background:TH.bottomBar,borderTop:"1px solid #555",flexShrink:0,zIndex:10,minHeight:52}}>
        {[
          {id:"tools",icon:tool==="eraser"?"eraser":tool==="bucket"?"bucket":tool==="eyedropper"?"eyedropper":tool==="hand"?"hand":tool==="smudge"?"smudge":tool==="lasso"?"lasso":tool==="rectsel"?"crop":tool==="text"?"text":tool==="transform"?"move":"brush",label:"Tool"},
          {id:"brush",icon:"pen",label:"Brush"},
          {id:"color",label:"Color"},
          {id:"layers",icon:"layers",label:String(curLayers.length)},
          {id:"anim",icon:"onion",label:`${fps}fps`},
          {id:"download",icon:"download",label:"Save",action:exportPng},
          {id:"back",icon:"back",label:"Back",action:()=>onBack(frames)},
        ].map(item=>(
          <button key={item.id} onClick={e=>{e.stopPropagation();item.action?item.action():tp(item.id)}}
            style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",
              padding:"4px 8px",fontFamily:"inherit",color:panel===item.id?TH.bottomIconActive:TH.bottomIcon,
              minWidth:40,minHeight:40,touchAction:"manipulation",WebkitTapHighlightColor:"transparent"}}>
            {item.id==="color"?(<div style={{width:22,height:22,borderRadius:6,background:col,border:panel==="color"?`2px solid ${TH.bottomIconActive}`:"1.5px solid #666"}}/>):(<Icon name={item.icon} size={20} color={panel===item.id?TH.bottomIconActive:TH.bottomIcon}/>)}
            <span style={{fontSize:9,fontWeight:500,color:panel===item.id?TH.bottomIconActive:"#999"}}>{item.label}</span>
          </button>))}
      </div>
    </div>
  );
}

try{ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));document.getElementById('loading').style.display='none'}catch(e){document.getElementById('error').style.display='block';document.getElementById('error').textContent='RENDER ERROR: '+e.message+'\n\n'+e.stack;document.getElementById('loading').style.display='none'}
</script>
</body>
</html>
